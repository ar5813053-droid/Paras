<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0A2540" />
  <title>Paras Clothe Emporium</title>
  <style>
    :root { --navy: #0A2540; --gold: #C9A227; --gold-light: #E0C04A; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--navy);
      color: white;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .splash {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: linear-gradient(160deg, #0A2540 0%, #061829 100%);
    }
    .logo {
      width: 88px; height: 88px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      display: flex; align-items: center; justify-content: center;
      font-size: 42px; font-weight: 700; color: var(--navy);
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(201,162,39,0.35);
    }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 8px; }
    .tagline { opacity: 0.75; font-style: italic; margin-bottom: 32px; }
    .badge {
      background: linear-gradient(135deg, #FEF3C7, #FDE68A);
      color: #92400E;
      font-size: 0.7rem; font-weight: 700;
      padding: 6px 12px; border-radius: 6px;
      letter-spacing: 0.05em;
    }
    .bottom-nav {
      display: flex; justify-content: space-around;
      background: white; color: #6B7280;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid #E5E7EB;
      font-size: 0.7rem;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; }
    .nav-item.active { color: var(--navy); font-weight: 600; }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">P</div>
    <h1>Paras Clothe Emporium</h1>
    <p class="tagline">Your Style, Your Store.</p>
    <div class="badge">DEMO BUILD • FULL APP COMING NEXT</div>
  </div>
  <nav class="bottom-nav">
    <div class="nav-item active"><span>🏠</span><span>Home</span></div>
    <div class="nav-item"><span>📂</span><span>Categories</span></div>
    <div class="nav-item"><span>♥</span><span>Wishlist</span></div>
    <div class="nav-item"><span>🛒</span><span>Cart</span></div>
    <div class="nav-item"><span>👤</span><span>Account</span></div>
  </nav>
</body>
</html>
