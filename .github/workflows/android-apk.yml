name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK manually
        run: |
          # Use the pre-installed SDK on the runner
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME || true
          # Accept licenses
          yes | sdkmanager --licenses || true
          # Install required packages
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          sdkmanager --list_installed | head -20

      - name: Install Capacitor CLI and create Android project
        run: |
          npm install -g @capacitor/cli@6.1.2
          ls -la dist/
          npx cap add android
          npx cap sync android
          ls -la android/ || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Xmx2g -Dorg.gradle.daemon=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paras-clothe-emporium-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
