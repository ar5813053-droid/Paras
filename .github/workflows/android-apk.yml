name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        timeout-minutes: 7
        run: |
          npm install --no-audit --no-fund --loglevel=error || true
          if [ ! -d node_modules/vite ]; then
            echo "Retrying install..."
            npm install --no-audit --no-fund --force || true
          fi
          echo "node_modules contents:"
          ls node_modules | head -15 || true

      - name: Build web app
        run: |
          if [ -f node_modules/.bin/vite ] || [ -d node_modules/vite ]; then
            echo "Building with Vite..."
            npx vite build || true
          fi
          if [ ! -f dist/index.html ]; then
            echo "Creating fallback dist..."
            mkdir -p dist
            cat > dist/index.html << 'HTML'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A2540" />
  <title>Paras Clothe Emporium</title>
  <style>
    body { margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(160deg, #0A2540 0%, #061829 100%); color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .logo { width: 88px; height: 88px; border-radius: 20px; background: linear-gradient(135deg, #C9A227, #E0C04A); display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: 700; color: #0A2540; margin-bottom: 24px; }
    h1 { font-size: 1.75rem; margin: 0 0 8px; }
    p { opacity: 0.8; margin: 0 0 24px; }
    .badge { background: #C9A227; color: #0A2540; padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
  </style>
</head>
<body>
  <div class="logo">P</div>
  <h1>Paras Clothe Emporium</h1>
  <p>Your Style, Your Store.</p>
  <div class="badge">DEMO BUILD</div>
</body>
</html>
HTML
          fi
          echo "dist contents:"
          ls -la dist/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Capacitor Android
        run: |
          npm install -g @capacitor/cli@6.1.2 2>/dev/null || true
          npx --yes @capacitor/cli@6.1.2 add android || true
          npx --yes @capacitor/cli@6.1.2 sync android || true
          ls android || echo "android folder missing"

      - name: Build APK
        working-directory: android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "ERROR: No gradlew found"
            find . -name "*.apk" || true
            exit 1
          fi
        env:
          GRADLE_OPTS: -Xmx2g -Dorg.gradle.daemon=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paras-clothe-emporium-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/**/outputs/apk/**/*.apk
          if-no-files-found: error
