name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: |
          npm install --no-audit --no-fund --no-optional || npm install --no-audit --no-fund --force
          # Verify key binaries exist
          ls node_modules/.bin/vite || echo "vite binary missing"
          ls node_modules/vite || echo "vite package missing"

      - name: Build React app
        run: npx vite build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Gradle assembleDebug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Xmx2g -Dorg.gradle.daemon=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paras-clothe-emporium-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
