name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm install --no-audit --no-fund --prefer-online --registry https://registry.npmjs.org/
          echo "=== node_modules/.bin ==="
          ls node_modules/.bin/ | head -20
          npx --yes vite --version

      - name: Build React app
        run: npx vite build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Gradle assembleDebug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Xmx2g -Dorg.gradle.daemon=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paras-clothe-emporium-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
